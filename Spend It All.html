      s.balance -= flow.spending; s.autoSpent += flow.spending; s.autoAcc += flow.spending;
      recordSpend(s,flow.spending,false);
      if (s.seconds % 10 === 0 && s.autoAcc) {
        log(s,'spend','Automatic spending','Your disposal team processed a batch of expenses.',-s.autoAcc); s.autoAcc = 0n;
      }
    }
    if (s.phase === 'settlement') return;
    if (s.phase === 'boss') { bossTick(s); return; }
    if (--s.eventIn <= 0) blow(s);
    if (s.phase === 'campaign') {
      if (s.stage === 6 && s.seconds % 75 === 0 && s.balance <= line(s)) {
        if (level(s,'sabotage') >= 3) {
          s.blocked++; log(s,'system','Rescue transfer intercepted','Financial Sabotage invalidated the Bank’s routing instructions.');
        } else grant(s,pool(s)/8n,'Automatic rescue transfer','Your account fell below the Bank’s comfort level. Sabotage level 3 blocks these transfers.');
      }
      const receipts = Math.min(s.receipts,55);
      s.review = Math.min(goal(s),s.review + receipts + (s.balance <= line(s) ? 65 : 0));
      s.receipts -= receipts;
      checkStage(s);
    }
  }
  function objective(s) {
    if (s.phase === 'campaign') {
      const progress = Math.min(1,s.review / goal(s));
      const low = s.balance <= line(s);
      const tactics=['',' Risky receipts can backfire.',' Bulk orders avoid jackpot insurance.',' Owned businesses pay royalties.',' Refund defenses stop echo deposits.',' Sabotage III blocks rescue transfers.'];
      const detail = s.review >= goal(s) && s.stage === 6
        ? 'Bring your balance to '+money(line(s))+' or less to summon the Bank.'
        : 'Spend to file receipts. Stay below '+money(line(s))+' for faster clearance.'+tactics[s.stage-1];
      return {title:files[s.stage-1][0], detail, progress, metric:Math.floor(progress*100)+'% cleared'+(low ? ' · low balance' : '')};
    }
    if (s.phase === 'boss') {
      const b=s.boss;
      return {title:bankMoves[b.round-1][0],detail:bankMoves[b.round-1][1],progress:1-b.hp/b.maxHp,metric:'Phase '+b.round+'/3 · '+b.hp+' resolve'};
    }
    if (s.phase === 'endless') return {title:'Liquidate another fortune',detail:'Empty the account to begin the next, larger fortune.',progress:Math.max(0,1-Number(s.balance*1000n/pool(s))/1000),metric:s.cycles+' fortunes cleared'};
    const won=s.phase==='won';
    return {title:won?'Account closed':'Spend your final cents',detail:won?'You have achieved financial instability.':'Use Max on the Single Penny to bring the balance to exactly $0.',progress:won?1:0,metric:won?'100% cleared':'Final settlement'};
  }
  function startEndless(s) {
    if (s.phase !== 'won') return false;
    s.phase='endless'; s.eventIn=28;
    grant(s,pool(s),'Endless credit line opened','An entirely new fortune awaits disposal.','bank');
    return true;
  }
  const bigFields=['balance','spent','earned','peak','autoSpent','biggest','payAcc','interestAcc','autoAcc'];
  const countFields=['seconds','itemsBought','orders','bulkOrders','events','backfires','blocked','zeroes','contests','cycles','logSeq'];
  function pack(s) {
    return JSON.parse(JSON.stringify(s,(_,value)=>typeof value === 'bigint' ? value.toString() : value));
  }
  function unpack(obj) {
    const fail=()=>{throw Error('Invalid Spend It All save');};
    const int=(n,upper=Number.MAX_SAFE_INTEGER)=>Number.isSafeInteger(n)&&n>=0&&n<=upper ? n : fail();
    const bigint=(str,signed=false)=>{
      if (typeof str!=='string' || !(signed?/^-?\d{1,70}$/:/^\d{1,70}$/).test(str)) fail();
      return BigInt(str);
    };
    const str=(s,limit)=>typeof s === 'string' && s.length<=limit ? s : fail();
    if (!obj || !Object.hasOwn(difficulties,obj.difficulty)) fail();
    const s=newRun(obj.difficulty);
    if (!['campaign','boss','settlement','won','endless'].includes(obj.phase)) fail();
    s.phase=obj.phase; s.stage=int(obj.stage,6);
    if (!s.stage || (s.phase!=='campaign' && s.stage!==6)) fail();
    for (const field of bigFields) s[field]=bigint(obj[field]);
    for (const field of countFields) s[field]=int(obj[field]);
    for (const u of UPGRADES) s.levels[u.id]=int(obj.levels?.[u.id],u.max);
    for (const item of ITEMS) s.owned[item.id]=int(obj.owned?.[item.id]);
    s.seed=int(obj.seed,4294967295); s.review=int(obj.review,goal(s));
    s.receipts=int(obj.receipts,9500); s.eventIn=int(obj.eventIn,120);
    const b=obj.boss;
    if (!b || b.maxHp!==100) fail();
    s.boss={round:int(b.round,3),hp:int(b.hp,100),maxHp:100,window:int(b.window,20),cooldown:int(b.cooldown,60),credit:bigint(b.credit)};
    if ((s.phase==='boss' && (!s.boss.round || !s.boss.hp)) || (s.phase==='won' && s.balance!==0n) ||
      (s.phase==='settlement' && (s.balance===0n || s.balance>99n)) || s.balance > s.peak ||
      s.itemsBought!==Object.values(s.owned).reduce((a,n)=>a+n,0) || s.bulkOrders>s.orders || s.orders>s.itemsBought ||
      s.balance!==capital[0]+s.earned-s.spent || s.autoSpent>s.spent || s.biggest>s.spent) fail();
    if (!Array.isArray(obj.feed) || obj.feed.length>90) fail();
    s.feed=obj.feed.map(entry=>{
      if (!entry || !['income','system','bank','spend'].includes(entry.kind)) fail();
      return {id:int(entry.id,s.logSeq),kind:entry.kind,title:str(entry.title,160),detail:str(entry.detail,1024),amount:bigint(entry.amount,true),at:int(entry.at,s.seconds)};
    });
    return s;
  }
  return {newRun,tick,buy,upgrade,quote,upgradeCost,unlocked,rates,objective,bankAction,startEndless,pack,unpack};
})();
</script>

function moneyLabel(a,cutoff=100000000n){
  if(a<0n) return '−'+moneyLabel(-a,cutoff);
  if(a<cutoff) return exact(a);
  const units=[[10n**26n,'Sp'],[10n**23n,'Sx'],[10n**20n,'Qi'],[10n**17n,'Q'],[10n**14n,'T'],[10n**11n,'B'],[10n**8n,'M'],[10n**5n,'K']];
  for(const [scale,suffix] of units) if(a>=scale){
    const part=String(a*100n/scale%100n).padStart(2,'0').replace(/0+$/,'');
    return '$'+(a/scale).toLocaleString('en-US')+(part?'.'+part:'')+suffix;
  }
  return exact(a);
}

function decodeSave(text){
  if(text.length>1800000)throw Error('File is too large.');
  const v=JSON.parse(text);
  const invalid=()=>{throw Error('This file is not a valid Spend It All save.');};
  if(v?.format!=='spend-it-all'||v.version!==1||!v.history||!v.prefs||!Array.isArray(v.badges)||v.badges.length>ACHIEVEMENTS.length)invalid();
  const run=Engine.unpack(v.run), h=v.history, p=v.prefs;
  const past=freshHistory(), settings=freshPrefs();
  for(const key of ['runs','wins','items','seconds','best']){
    if(!Number.isSafeInteger(h[key])||h[key]<0)invalid();
    past[key]=h[key];
  }
  for(const key of ['spent','earned']){
    if(typeof h[key]!=='string'||!/^\d{1,75}$/.test(h[key]))invalid();
    past[key]=BigInt(h[key]);
  }
  if(past.wins>past.runs||past.best>past.seconds)invalid();
  for(const key of ['sound','motion','paused','started']){
    if(typeof p[key]!=='boolean')invalid();
    settings[key]=p[key];
  }
  if(!['Relaxed','Standard','Ruthless'].includes(p.nextDifficulty))invalid();
  settings.nextDifficulty=p.nextDifficulty;
  if(!Number.isSafeInteger(p.victorySeconds)||p.victorySeconds<0||p.victorySeconds>run.seconds)invalid();
  settings.victorySeconds=p.victorySeconds;
  const ids=new Set(ACHIEVEMENTS.map(a=>a.id));
  if(v.badges.some(id=>!ids.has(id)))invalid();
  return {run,history:past,prefs:settings,badges:new Set(v.badges)};
}
function applySave(v){
  game=v.run; history=v.history; prefs=v.prefs; badges=v.badges;

}

function tone(type){
  if(!prefs.sound)return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime;
    const notes=type==='victory'?[330,440,554,660]:type==='stage'?[330,500,650]:type==='bank'?[185,128]:[590,365];
    notes.forEach((hz,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),start=now+i*.07;
      o.type='sine';o.frequency.setValueAtTime(hz,start);g.gain.setValueAtTime(.0001,start);
      g.gain.exponentialRampToValueAtTime(.045,start+.007);g.gain.exponentialRampToValueAtTime(.0001,start+.11);
      o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+.12);
    });
  }catch{}
}

function showBalance(){
  const target=game.balance, el=$('balance');el.title=exact(target);
  if(target===animationTarget)return;
  animationTarget=target;cancelAnimationFrame(counterFrame);
  const orig=displayedBalance,start=performance.now();
  const paint=v=>{displayedBalance=v;el.textContent=moneyLabel(v,100000000000n);};
  if(!prefs.motion||orig===target||target===0n){paint(target);return;}
  function frame(t){
    const step=Math.min(1000,Math.round((t-start)*1000/300));
    const smooth=BigInt(1000-Math.round(1000*(1-step/1000)**3));

  }

}

}
function renderUpgrades(){
  heading('Reverse upgrades','bolt');
  $('view-body').innerHTML=`<p class="tab-intro">Build a strategy that loses money for you. Each level lasts for the rest of this run.</p><div class="upgrade-grid">${UPGRADES.map(u=>`<article class="upgrade-card" data-up-card="${u.id}"><div class="upgrade-top"><span class="tile-icon">${icon(upgradeIcons[u.id])}</span><span class="micro level"></span></div><h3>${escapeText(u.name)}</h3><p>${escapeText(u.desc)}</p><p class="trade">${escapeText(u.trade)}</p><button class="buy-btn" data-upgrade="${u.id}"><span>${icon('plus')}<span class="buy-caption">Upgrade</span></span><strong></strong></button></article>`).join('')}</div>`;
  updateUpgrades();
}
function updateUpgrades(){
  const benefit=(id,level)=>{
    const effects={
      accountant:()=>13*level+'% smaller paychecks',
      shopper:()=>(.13*level).toFixed(2)+'% of stage funds spent / sec',
      luxury:()=>level+' stage'+(level===1?'':'s')+' of early access',
      investor:()=>(.3*level).toFixed(1)+'% of balance lost / sec',
      leak:()=>(.07*level).toFixed(2)+'% of stage funds drained / sec',
      refund:()=>25*level+'% less refund income',
      sabotage:()=>12*level+'% smaller windfalls',
      cashback:()=>Math.round(level*100/3)+'% less cashback',
      destructive:()=>18*level+'% more spent per item'
    };
    return effects[id]();
  };
  for(const card of $('view-body').querySelectorAll('[data-up-card]')){
    const u=byUpgrade.get(card.dataset.upCard),n=game.levels[u.id],max=n>=u.max,cost=max?0n:Engine.upgradeCost(game,u.id);
    card.querySelector('.level').textContent='LEVEL '+n+' / '+u.max;
    let effect=card.querySelector('.upgrade-effect');
    if(!effect){effect=document.createElement('div');effect.className='upgrade-effect';card.querySelector('button').before(effect);}
    effect.textContent=(max?'Active':'Next level')+' · '+benefit(u.id,max?n:n+1);
    const b=card.querySelector('button');b.disabled=!canOrder()||game.phase==='settlement'||max||cost>game.balance;
    b.querySelector('.buy-caption').textContent=max?'Fully upgraded':'Upgrade';
    b.querySelector('strong').textContent=max?'✓':moneyLabel(cost,10000000n); b.title=max?'Maximum level':exact(cost);
    b.setAttribute('aria-label',max?u.name+' fully upgraded':'Upgrade '+u.name+' for '+exact(cost));
  }
}
function row(label,value){return `<div class="record"><span>${escapeText(label)}</span><strong>${escapeText(value)}</strong></div>`;}
function statTile(label,value,cls=''){return `<div class="statbox"><div class="kpi-label">${escapeText(label)}</div><strong class="${cls}">${escapeText(value)}</strong></div>`;}
function renderStats(){
  heading('Statistics','bars');
  const wins=history.wins+(didWin()?1:0),owned=ITEMS.filter(i=>game.owned[i.id]).sort((a,b)=>game.owned[b.id]-game.owned[a.id]);
  const nowBest=didWin()?prefs.victorySeconds||game.seconds:0;
  const best=history.best&&nowBest?Math.min(history.best,nowBest):history.best||nowBest;
  $('view-body').innerHTML=`<p class="tab-intro">${game.difficulty} difficulty · ${elapsed(game.seconds)} active time · Stage ${game.stage} of 6</p><div class="stat-grid">${statTile('Total spent',moneyLabel(game.spent),'coral')}${statTile('Unwanted income',moneyLabel(game.earned),'green')}${statTile('Purchases',numberLabel(game.itemsBought))}${statTile('Peak balance',moneyLabel(game.peak))}</div><h3 class="subheading">Run ledger</h3><div class="records">${row('Marketplace orders',numberLabel(game.orders))}${row('Automatic spending',moneyLabel(game.autoSpent))}${row('Largest order',moneyLabel(game.biggest))}${row('Financial windfalls',numberLabel(game.events))}${row('Purchases that backfired',numberLabel(game.backfires))}${row('Bank transfers disputed',game.contests)}${game.phase==='endless'?row('Endless fortunes cleared',game.cycles):''}</div><h3 class="subheading">Lifetime record</h3><div class="records">${row('Runs started',history.runs+1)}${row('Victories',wins)}${row('Fastest victory',best?elapsed(best):'—')}${row('Lifetime spending',moneyLabel(history.spent+game.spent))}${row('Lifetime unwanted income',moneyLabel(history.earned+game.earned))}${row('Lifetime purchases',numberLabel(history.items+game.itemsBought))}${row('Lifetime active time',elapsed(history.seconds+game.seconds))}</div><h3 class="subheading">Purchase inventory</h3><div class="records">${owned.length?owned.map(i=>row(i.name,'×'+numberLabel(game.owned[i.id]))).join(''):'<p class="empty">Your first purchase will appear here.</p>'}</div>`;
}
function renderAchievements(){
  heading('Achievements','award','',badges.size+' / '+ACHIEVEMENTS.length);
  const subset=ACHIEVEMENTS.filter(a=>awardFilter==='all'||(awardFilter==='earned'?badges.has(a.id):!badges.has(a.id)));
  $('view-body').innerHTML=`<p class="tab-intro">${badges.size} of ${ACHIEVEMENTS.length} unlocked across all runs. Secret awards reveal themselves when earned.</p><div class="filter-bar">${[['all','All awards'],['earned','Unlocked'],['locked','Locked']].map(([id,label])=>`<button class="filter ${awardFilter===id?'on':''}" data-award-filter="${id}" aria-pressed="${awardFilter===id}">${label}</button>`).join('')}</div><div class="achievement-grid">${subset.map(a=>{
    const yes=badges.has(a.id),secret=a.secret&&!yes;
    return `<article class="achievement ${yes?'unlocked':'locked'}"><div class="achievement-top"><span class="tile-icon">${icon(yes?'award':secret?'lock':'star')}</span><span class="micro">${yes?'Unlocked':secret?'Secret':'Locked'}</span></div><h3>${secret?'Sealed record':escapeText(a.name)}</h3><p>${secret?'The Bank has redacted the conditions.':escapeText(a.desc)}</p></article>`;
  }).join('')}</div>${subset.length?'':'<p class="empty">No awards in this group yet.</p>'}`;
}
function renderView(){({market:renderMarket,upgrades:renderUpgrades,stats:renderStats,achievements:renderAchievements})[view]();}
function freshUI(){topSummary();renderView();updateSaveStatus();}
function changes(notify=true){
  const previousBadges=badges.size, stageChanged=lastStage!==game.stage,phaseChanged=lastPhase!==game.phase,roundChanged=lastRound!==game.boss.round;
  if(stageChanged&&notify){toast('Stage '+game.stage+' · '+STAGES[game.stage-1].name);tone('stage');}
  if(phaseChanged&&game.phase==='boss'&&notify){toast('The Bank has entered the terminal.');tone('bank');}
  if(phaseChanged&&game.phase==='won'){prefs.victorySeconds=game.seconds;tone('victory');}
  if(roundChanged&&game.phase==='boss'&&game.boss.round>1&&notify)toast('The Bank changed tactics · Phase '+game.boss.round);
  const justWon=phaseChanged&&game.phase==='won';
  lastStage=game.stage;lastPhase=game.phase;lastRound=game.boss.round;
  unlockBadges(notify);topSummary();
  if(stageChanged||phaseChanged)renderView();
  else if(view==='market')updateMarket();
  else if(view==='upgrades')updateUpgrades();
  else if(view==='stats')renderStats();
  else if(badges.size!==previousBadges)renderAchievements();
  if(justWon&&notify)showDialog('victory');
}

const btn=(action,text,style='alt-btn')=>`<button class="${style}" data-action="${action}">${text}</button>`;
const guideStep=(n,title,description)=>`<div class="guide-step"><span class="guide-num">${n}</span><div><h3>${title}</h3><p>${description}</p></div></div>`;
const block=(title,body)=>`<div class="dialog-block"><h3>${title}</h3>${body}</div>`;
function guideContent(){
  return guideStep('01','Spend your first dollar','Buy anything in the marketplace to start the clock. The Bank pays you every active second. Your job is to spend faster.')+
  guideStep('02','Get your file cleared','Purchases file receipts. Keeping the balance below the current objective’s limit clears your file faster. Try bulk orders and a Professional Shopper to keep the account draining.')+
  guideStep('03','Beat the Bank','Clear all six stages. Watch for Bank transfers, press Dispute while the window is open, and exploit the weakness shown for each phase. Spend the remaining pennies to finish.')+
  block('Keyboard shortcuts','<div class="key-row"><kbd>M</kbd> Market <kbd>U</kbd> Upgrades <kbd>T</kbd> Statistics <kbd>A</kbd> Awards</div><div class="key-row"><kbd>P</kbd> Pause <kbd>S</kbd> Sound <kbd>B</kbd> Dispute <kbd>?</kbd> Guide <kbd>Esc</kbd> Close</div>')+
  '<p class="dialog-hint">The clock pauses while dialogs are open or this tab is hidden. Progress saves on this device.</p><div class="actions">'+btn('close','Got it','primary-btn')+'</div>';
}
function settingsContent(){
  const toggle=(action,name,desc,on)=>`<div class="option-row"><div><strong>${name}</strong><small>${desc}</small></div><button class="switcher" data-action="${action}" aria-pressed="${on}">${on?'On':'Off'}</button></div>`;
  const difficulty=`<label class="option-row"><span><strong>Difficulty</strong><small>${prefs.started?'Applies to the next run. Current run: '+game.difficulty+'.':'Applies to this new account.'}</small></span><select id="difficulty">${['Relaxed','Standard','Ruthless'].map(d=>`<option ${prefs.nextDifficulty===d?'selected':''}>${d}</option>`).join('')}</select></label>`;
  return (saveBlocked?'<p class="notice">The stored save could not be read. Export the stored copy before choosing Import or Reset.</p>':'')+
    toggle('sound','Sound effects','Purchase tones and Bank alerts.',prefs.sound)+toggle('motion','Motion effects','Animate balances and floating transactions.',prefs.motion)+difficulty+
    block('Save management','<p>Export a portable backup or restore a saved account. Restoring replaces the current account and its lifetime record.</p><div class="actions">'+btn('export',icon('receipt')+' Export save')+btn('import',icon('up')+' Import save')+(saveBlocked?btn('raw-export','Export stored copy'):'')+'</div>')+
    block('Account controls','<p>A new run keeps your achievements and lifetime records. A full reset clears the entire local profile.</p><div class="actions">'+btn('new','New game')+btn('reset','Reset everything','danger-btn')+'</div>');
}
function dialogDef(mode){
  switch(mode){
  case 'guide':return ['Player handbook','Field guide',guideContent()];
  case 'settings':return ['Terminal preferences','Settings',settingsContent()];
  case 'progress':return ['Campaign dossier','Stage progression',STAGES.map((st,i)=>guideStep(String(i+1).padStart(2,'0'),`<span class="${i+1===game.stage?'current-stage':''}">${st.name}${i+1<game.stage?' ✓':i+1===game.stage?' · Current':''}</span>`,st.description)).join('')];
  case 'ledger':return ['Account records','Transaction history',`<p>Latest ${game.feed.length} ledger entries · timestamps show active play time.</p>`+game.feed.map(e=>`<div class="history-item">${feedRow(e)}<p>${escapeText(e.detail)}</p></div>`).join('')];
  case 'new':return ['Account controls','Start a new game?',`<p>Start a ${prefs.nextDifficulty} run with $100,000. Your current run ends here. Your lifetime statistics and earned achievements carry forward.</p><div class="actions">${btn('confirm-new','Start new game','primary-btn')}${btn('settings','Cancel')}</div>`];
  case 'reset':return ['Account controls','Reset everything?',`<p>This erases this device’s current run, lifetime records, settings, and achievements. Export a save first if you want to keep them.</p><div class="actions">${btn('confirm-reset','Erase local profile','danger-btn')}${btn('settings','Cancel')}</div>`];
  case 'import-confirm':return ['Save management','Restore this account?',`<p>Restore the ${importCandidate.run.difficulty} account in Stage ${importCandidate.run.stage} with ${exact(importCandidate.run.balance)}. This replaces your current run and lifetime record.</p><div class="actions">${btn('confirm-import','Restore save','primary-btn')}${btn('settings','Cancel')}</div>`];
  case 'victory':return ['Certified closing statement','You are completely broke.',`<p class="notice">The Bank has conceded. Your closing balance is <strong>$0.00</strong>.</p><div class="records">${row('Difficulty',game.difficulty)}${row('Time to close',elapsed(prefs.victorySeconds||game.seconds))}${row('Total disposed',moneyLabel(game.spent))}${row('Transfers disputed',game.contests)}</div><p>“We would offer you compensation for the inconvenience, but the account is closed.”</p><div class="actions">${btn('endless','Enter endless mode','primary-btn')}${btn('close','Keep account closed')}</div><p class="dialog-hint">Endless mode opens a fresh credit line on this victorious run.</p>`];
  }
}
function showDialog(mode){
  const def=dialogDef(mode);if(!def)return;
  dialogMode=mode;activeModalPause=true;tickAnchor=performance.now();
  $('dialog-kicker').textContent=def[0];$('dialog-title').textContent=def[1];$('dialog-body').innerHTML=def[2];
  $('dialog').dataset.mode=mode;
  if(mode==='victory'){
    $('dialog-body').querySelector('.notice').outerHTML='<div class="closing-receipt"><div><small>FINAL BALANCE</small><strong>$0.00</strong></div><span>ACCOUNT<br>CLOSED</span></div>';
  }
  const d=$('dialog');if(!d.open)d.showModal();
  d.scrollTop=0;d.querySelector('[data-action="close"]').focus({preventScroll:true});
}
function closeDialog(){
  if($('dialog').open)$('dialog').close();
  dialogMode='';activeModalPause=false;tickAnchor=performance.now();importCandidate=null;
}
function downloadData(txt,name){
  const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function newGame(full){
  let difficult=prefs.nextDifficulty;
  if(full){history=freshHistory();prefs=freshPrefs();difficult=prefs.nextDifficulty;badges=new Set();}
  else{archiveRun();prefs={...prefs,started:false,paused:false,victorySeconds:0};}
  game=Engine.newRun(difficult);category='all';sortMode='featured';visible=12;bulk=1;awardFilter='all';
  saveBlocked=false;applySave({run:game,history,prefs,badges});
  closeDialog();go('market');freshUI();persist();toast(full?'Local profile reset.':'New account opened.');
}
function performBuy(id,qty){
  if(!canOrder())return;
  const q=Engine.quote(game,id,qty);
  if(!Engine.buy(game,id,qty)){toast('This order cannot be filled.');return;}
  setStarted();floatAmount(-q.cost);tone('buy');changes();
  if(view==='market'&&sortMode!=='featured')renderMarket();
  const card=$('view-body').querySelector('[data-card="'+id+'"]');
  if(card&&prefs.motion){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');}
  persist();
}
function setPause(){
  if(game.phase==='won')return;
  if(!prefs.started){setStarted();prefs.paused=false;}
  else{prefs.paused=!prefs.paused;tickAnchor=performance.now();}
  changes(false);toast(prefs.paused?'Game paused. Press P to resume.':'Clock running.');persist();
}
function action(name){
  switch(name){
  case 'settings':case 'guide':case 'progress':case 'ledger':case 'new':case 'reset':case 'victory':showDialog(name);break;
  case 'close':closeDialog();break;
  case 'pause':setPause();break;
  case 'sound':prefs.sound=!prefs.sound;if(prefs.sound)tone('buy');topSummary();if(dialogMode==='settings')showDialog('settings');persist();break;
  case 'motion':prefs.motion=!prefs.motion;animationTarget=null;topSummary();showDialog('settings');persist();break;
  case 'more':visible+=12;renderMarket();break;
  case 'export':downloadData(encodeSave(),'Spend It All - Stage '+game.stage+'.json');toast('Save exported.');break;
  case 'raw-export':try{downloadData(localStorage.getItem(SAVE_KEY)||'','Spend It All - recovery.json');}catch{toast('Stored copy unavailable.');}break;
  case 'import':$('import-file').value='';$('import-file').click();break;
  case 'confirm-import':if(importCandidate){
    const v=importCandidate;applySave(v);saveBlocked=false;category='all';sortMode='featured';bulk=1;visible=12;awardFilter='all';closeDialog();go('market');freshUI();persist();toast('Account restored.');
  }break;
  case 'confirm-new':newGame(false);break;
  case 'confirm-reset':newGame(true);break;
  case 'dispute':if(canOrder()&&Engine.bankAction(game)){tone('bank');changes();persist();}break;
  case 'settle':if(game.phase==='settlement')performBuy('penny','max');break;
  case 'endless':if(Engine.startEndless(game)){closeDialog();prefs.paused=false;setStarted();changes();persist();toast('Endless credit line opened.');}break;
  }
}
document.addEventListener('click',e=>{
  const target=e.target.closest('button,[data-go]');if(!target||target.disabled)return;
  const d=target.dataset;
  if(d.go){e.preventDefault();if($('dialog').open)closeDialog();go(d.go,true);}
  else if(d.buy)performBuy(d.buy,bulk);
  else if(d.upgrade){
    if(!canOrder())return;
    const cost=Engine.upgradeCost(game,d.upgrade);
    if(Engine.upgrade(game,d.upgrade)){
      setStarted();floatAmount(-cost);tone('buy');changes();
      if(d.upgrade==='luxury')toast('Early access expanded. Check the marketplace departments.');
      persist();
    }
  }else if(d.cat){category=d.cat;visible=12;renderMarket();}
  else if(d.bulk){bulk=d.bulk==='max'?'max':Number(d.bulk);renderMarket();}
  else if(d.awardFilter){awardFilter=d.awardFilter;renderAchievements();}
  else if(d.action)action(d.action);
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort-mode'){sortMode=e.target.value;visible=12;renderMarket();$('sort-mode').focus({preventScroll:true});}
  if(e.target.id==='more-cat'&&e.target.value){category=e.target.value;visible=12;renderMarket();}
  if(e.target.id==='difficulty'){
    prefs.nextDifficulty=e.target.value;
    if(!prefs.started&&game.seconds===0&&game.itemsBought===0){
      game=Engine.newRun(prefs.nextDifficulty);lastSeq=-1;freshUI();
    }
    persist();
  }
});
$('import-file').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try{if(file.size>1800000)throw Error();const candidate=decodeSave(await file.text());importCandidate=candidate;showDialog('import-confirm');}
  catch{toast('Cannot restore this file. Choose a valid Spend It All JSON save.');}
});
$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
$('dialog').addEventListener('click',e=>{
  if(e.target!==$('dialog'))return;const rect=$('dialog').getBoundingClientRect();
  if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeDialog();
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||e.target.matches('input,textarea,select,[contenteditable="true"]'))return;
  if($('dialog').open)return;
  const key=e.key.toLowerCase(),nav={m:'market',u:'upgrades',t:'stats',a:'achievements'},acts={p:'pause',s:'sound',b:'dispute','?':'guide'};
  if(nav[key]){e.preventDefault();go(nav[key],true);}
  else if(acts[key]){e.preventDefault();action(acts[key]);}
});
function advance(){
  const now=performance.now();
  if(document.hidden||!tickerAllowed()){tickAnchor=now;return;}
  const steps=Math.floor((now-tickAnchor)/1000);
  if(steps<1)return;
  tickAnchor+=steps*1000;
  const prevSeq=game.logSeq,oldStage=game.stage,oldPhase=game.phase;
  for(let i=0;i<Math.min(steps,60)&&game.phase!=='won';i++)Engine.tick(game);
  if(game.logSeq>prevSeq){
    const recent=game.feed.find(e=>e.id>prevSeq&&e.amount!==0n);
    if(recent)floatAmount(recent.amount);
  }
  changes();if(game.seconds%5===0||steps>1||oldStage!==game.stage||oldPhase!==game.phase)persist();
}
document.addEventListener('visibilitychange',()=>{tickAnchor=performance.now();if(document.hidden)persist();});
window.addEventListener('pagehide',persist);
readLocal();unlockBadges(false);freshUI();
if(saveBlocked)toast('Stored save needs recovery. Open Settings to export or restore it.');
window.setInterval(advance,200);

})();</script>
</body>
